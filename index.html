/* =========================================================================
   STAGE 4 — Order detail + Record payment + Reminder preview
   ========================================================================= */
function buildTimeline(o, today) {
  const ev = [], tot = C.total(o);
  ev.push({ key: 'c', icon: 'edit', label: 'Order created', sub: C.fmtDate(o.createdAt), state: 'done' });
  if (o.sharedAt) ev.push({ key: 's', icon: 'send', label: 'Request sent', sub: C.fmtDate(o.sharedAt), state: 'done' });
  else ev.push({ key: 's', icon: 'send', label: 'Request not sent yet', sub: 'Share it on WhatsApp to start tracking', state: 'pending' });
  let run = 0;
  o.payments.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach((p, i) => {
    const before = run; run += p.amount;
    let label = 'Part payment';
    if (i === 0 && o.depositRequired > 0 && before < o.depositRequired && run < tot) label = 'Deposit';
    else if (run >= tot) label = i === 0 ? 'Paid in full' : 'Balance paid';
    ev.push({ key: p.id, icon: 'cash', label: `${label} · ${naira(p.amount)}`, sub: C.fmtDate(p.date) + (p.note ? ` · ${p.note}` : ''), state: 'done' });
  });
  const due = C.dueNow(o), late = C.daysLate(o, today);
  if (o.sharedAt && due.amount > 0) {
    ev.push({ key: 'due', icon: 'clock', label: `${KIND_LABEL[due.kind]} due · ${naira(due.amount)}`, sub: `${C.fmtDate(o.deadline)} · ${late ? C.lateLabel(late) : C.relDays(o.deadline, today)}`, state: late ? 'late' : 'pending' });
    if (due.kind === 'deposit' && C.balance(o) > due.amount) ev.push({ key: 'bal', icon: 'cash', label: `Then balance · ${naira(C.balance(o) - due.amount)}`, sub: 'Before delivery', state: 'pending' });
  }
  if (o.deliveredAt) ev.push({ key: 'd', icon: 'truck', label: 'Delivered', sub: C.fmtDate(o.deliveredAt), state: 'done' });
  return ev;
}

function PaymentSheet({ ctx, order, onClose }) {
  const { today, nav, A, notify } = ctx;
  const c = ctx.custById(order.customerId) || { name: 'Customer' };
  const [snap] = useState(() => ({ due: C.dueNow(order), bal: C.balance(order) }));
  const { due, bal } = snap;
  const [amount, setAmount] = useState(0);
  const [date, setDate] = useState(today);
  const [note, setNote] = useState('');
  const [err, setErr] = useState('');
  const [done, setDone] = useState(null);

  function save() {
    if (!(amount > 0)) return setErr('Enter the amount you received.');
    if (amount > bal) return setErr(`That’s more than the balance of ${naira(bal)}. Refunds and overpayments aren’t supported yet.`);
    if (!date) return setErr('Pick the date you received it.');
    if (date > today) return setErr('The payment date can’t be in the future.');
    A.patchOrder(order.id, o => ({ payments: [...o.payments, { id: C.uid('p'), amount, date, note: note.trim() }] }));
    const left = bal - amount;
    notify(`${naira(amount)} recorded · ${left > 0 ? naira(left) + ' left' : 'fully paid'}`);
    setDone({ left });
  }

  if (done) {
    return (
      <Sheet title="Payment recorded" onClose={onClose}>
        <div className="success">
          <div className="tick"><Icon name="check" size={36} /></div>
          <h2><Amount value={amount} />saved</h2>
          {done.left > 0 ? (
            <>
              <p>{C.firstName(c)} still owes <b style={{ color: 'var(--ink)' }}>{naira(done.left)}</b>. Send the balance request now?</p>
              <div className="stack">
                <button className="btn btn-yellow btn-block btn-lg" onClick={() => { onClose(); nav.go({ name: 'preview', orderId: order.id }); }}><Icon name="send" /> Send balance request now</button>
                <button className="btn btn-block" onClick={onClose}>Not now</button>
              </div>
            </>
          ) : (
            <>
              <p>{order.number} is fully paid. Send {C.firstName(c)} a receipt?</p>
              <div className="stack">
                <button className="btn btn-yellow btn-block btn-lg" onClick={() => { onClose(); nav.go({ name: 'receipt', orderId: order.id }); }}><Icon name="receipt" /> Share receipt</button>
                <button className="btn btn-block" onClick={onClose}>Done</button>
              </div>
            </>
          )}
        </div>
      </Sheet>
    );
  }

  return (
    <Sheet title="Record payment" onClose={onClose}>
      <p className="hint" style={{ marginBottom: 12 }}>{c.name} · {order.number} · {naira(bal)} left</p>
      <div className="field">
        <label htmlFor="pay-amt">Amount received</label>
        <NumInput id="pay-amt" value={amount} onChange={v => { setAmount(v); setErr(''); }} error={err} />
        <div className="chips" role="group" aria-label="Amount shortcuts">
          {due.kind === 'deposit' && due.amount < bal && <button type="button" className="chip" aria-pressed={amount === due.amount} onClick={() => { setAmount(due.amount); setErr(''); }}>Deposit {naira(due.amount)}</button>}
          <button type="button" className="chip" aria-pressed={amount === bal} onClick={() => { setAmount(bal); setErr(''); }}>Full balance {naira(bal)}</button>
        </div>
        {err && <p className="error" id="pay-amt-err"><Icon name="alert" size={16} />{err}</p>}
      </div>
      <div className="grid2">
        <Field id="pay-date" label="Date received">
          <input id="pay-date" type="date" className="input" value={date} max={today} onChange={e => { setDate(e.target.value); setErr(''); }} />
        </Field>
        <Field id="pay-note" label="Note (optional)">
          <input id="pay-note" className="input" value={note} placeholder="e.g. Opay transfer" onChange={e => setNote(e.target.value)} />
        </Field>
      </div>
      <div className="callout"><Icon name="bank" size={20} /><span>Only record this after checking your bank app.</span></div>
      <button className="btn btn-yellow btn-block btn-lg" onClick={save}><Icon name="check" /> Save payment</button>
    </Sheet>
  );
}

const TONES = [{ id: 'friendly', label: 'Friendly' }, { id: 'neutral', label: 'Neutral' }, { id: 'firm', label: 'Firm' }];
function ReminderScreen({ ctx, orderId }) {
  const { state, today, nav, notify } = ctx;
  const o = ctx.orderById(orderId), c = ctx.custById(o.customerId), s = state.seller;
  const [tone, setTone] = useState(s.defaultReminderTone || 'friendly');
  const [text, setText] = useState(() => C.reminderMessage(tone, o, c, s, today));
  const [edited, setEdited] = useState(false);
  const tabRefs = useRef([]);
  if (!C.isOpen(o)) {
    return (
      <div className="screen">
        <TopBar title="Reminder" onBack={nav.back} />
        <Empty title="Nothing to remind about">{o.sharedAt ? `${o.number} is fully paid.` : 'Send the payment request first, then you can remind them.'}</Empty>
      </div>
    );
  }
  const pick = t => { setTone(t); setText(C.reminderMessage(t, o, c, s, today)); setEdited(false); };
  const onTabKey = (e, i) => {
    let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % TONES.length;
    if (e.key === 'ArrowLeft') n = (i + TONES.length - 1) % TONES.length;
    if (n !== null) { e.preventDefault(); pick(TONES[n].id); tabRefs.current[n].focus(); }
  };
  const due = C.dueNow(o), late = C.daysLate(o, today);
  return (
    <div className="screen">
      <TopBar title="Reminder" onBack={nav.back} />
      <div className="card" style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 16 }}>
        <Avatar name={c.name} id={c.id} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <b>{c.name}</b>
          <div className="hint">{naira(due.amount)} {KIND_LABEL[due.kind].toLowerCase()} · {o.number}</div>
        </div>
        {late > 0 && <LatePill days={late} />}
      </div>
      <div className="tabs" role="tablist" aria-label="Message tone">
        {TONES.map((t, i) => (
          <button key={t.id} ref={el => tabRefs.current[i] = el} role="tab" id={'tab-' + t.id} aria-selected={tone === t.id} aria-controls="tone-panel"
            tabIndex={tone === t.id ? 0 : -1} onKeyDown={e => onTabKey(e, i)} onClick={() => pick(t.id)}>{t.label}</button>
        ))}
      </div>
      <div role="tabpanel" id="tone-panel" aria-labelledby={'tab-' + tone}>
        <div className="field">
          <label htmlFor="rem-text">Message (you can edit it)</label>
          <textarea id="rem-text" className="textarea" value={text} onChange={e => { setText(e.target.value); setEdited(true); }} aria-describedby="rem-hint" />
          <p className="hint" id="rem-hint">{edited ? 'Switching tone will replace your edits.' : 'Bank details are included as plain text so they can copy them.'}</p>
        </div>
      </div>
      <a className="btn btn-yellow btn-lg btn-block" href={C.waLink(c.phone, text)} target="_blank" rel="noopener noreferrer"
        aria-disabled={!text.trim()} onClick={e => { if (!text.trim()) { e.preventDefault(); return; } notify('Opening WhatsApp · press send when ready'); }}>
        <Icon name="chat" /> Open WhatsApp
      </a>
      <div className="callout" style={{ marginTop: 16 }}><Icon name="info" size={20} /><span>Nothing is sent automatically. WhatsApp opens with this message and you press send.</span></div>
    </div>
  );
}

const BANKS = ['Access Bank', 'GTBank', 'First Bank', 'UBA', 'Zenith Bank', 'Kuda', 'Opay', 'Moniepoint', 'PalmPay', 'Fidelity Bank', 'Wema Bank', 'Stanbic IBTC', 'Sterling Bank', 'FCMB', 'Union Bank', 'Ecobank'];
function validateSeller(f, step) {
  const e = {};
  if (!step || step === 1) { if (!f.businessName.trim()) e.businessName = 'Add your business name.'; }
  if (!step || step === 2) {
    if (!f.bankName.trim()) e.bankName = 'Add your bank.';
    if (!/^\d{10}$/.test(f.accountNumber.replace(/\s/g, ''))) e.accountNumber = 'Nigerian account numbers have 10 digits.';
    if (!f.accountName.trim()) e.accountName = 'Add the name on the account.';
  }
  return e;
}
function SellerFields({ f, set, err, only }) {
  const inp = (id, label, props = {}, hint) => (
    <Field id={'s-' + id} label={label} error={err[id]} hint={hint}>

        aria-describedby={err[id] ? 's-' + id + '-err' : hint ? 's-' + id + '-hint' : undefined}
        onChange={e => set({ [id]: e.target.value })} {...props} />
    </Field>
  );
  return (
    <>
      {(!only || only === 1) && <>
        {inp('businessName', 'Business name', { placeholder: 'e.g. Mimi Crochets', autoComplete: 'organization' }, 'Shown on every request and receipt.')}
        {only !== 1 && inp('logoInitials', 'Logo initials', { maxLength: 3, placeholder: 'MC' })}
        {inp('phone', 'Your WhatsApp number', { type: 'tel', inputMode: 'tel', placeholder: '0803 000 1122' }, 'Optional. Printed on your documents.')}
      </>}
      {(!only || only === 2) && <>
        {inp('bankName', 'Bank', { list: 'banks', placeholder: 'e.g. GTBank', autoComplete: 'off' })}

    word: 'Nudge', tone: 'magenta', title: 'Nudge late payers',
    body: 'See who’s late at a glance. Send a friendly, neutral or firm reminder. You always press send.',
    art: (
      <div className="art-stack">
        <div className="mini-card">
          <span className="avatar" style={{ width: 36, height: 36, fontSize: 12 }}>TB</span>
          <span className="who"><b>Tolu Bello</b><span className="pill pill-late"><Icon name="clock" size={14} /><span className="pill-t">1 day late</span></span></span>
          <span className="amt"><Amount value={37000} /></span>
        </div>
        <div className="mini-tabs"><span className="on">Friendly</span><span>Neutral</span><span>Firm</span></div>
        <div className="mini-msg">Hi Tolu, hope you’re well! Just a little reminder that the ₦37,000 deposit for your crochet bag is still open…</div>
      </div>
    )
  }
];

function Onboarding({ ctx }) {
  const { A } = ctx;
  const [i, setI] = useState(0);
  const last = OB_SLIDES.length - 1;
  const drag = useRef(null);
  const go = n => setI(Math.max(0, Math.min(last, n)));
  useEffect(() => {
    const onKey = e => { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [i]);
  const onDown = e => { drag.current = e.clientX; };
  const onUp = e => {
    if (drag.current == null) return;
    const dx = e.clientX - drag.current; drag.current = null;
    if (dx < -45) go(i + 1); else if (dx > 45) go(i - 1);
  };
  return (
    <div className="ob screen">
      <div className="ob-viewport" role="region" aria-roledescription="carousel" aria-label="Welcome to Tally"
        onPointerDown={onDown} onPointerUp={onUp} onPointerCancel={() => { drag.current = null; }}>
        <div className="ob-track" style={{ transform: `translateX(-${i * 100}%)` }}>
          {OB_SLIDES.map((s, n) => (
            <section key={n} className="ob-slide" aria-roledescription="slide" aria-label={`${n + 1} of ${OB_SLIDES.length}`} aria-hidden={n !== i}>
              <div className={'ob-panel ' + s.tone}>
                {n === 0
                  ? <h1 className="ob-word" tabIndex={-1} aria-label={s.title}>{s.word}</h1>
                  : <h2 className="ob-word" aria-label={s.title}>{s.word}</h2>}
                <p className="ob-body">{s.body}</p>
                <div className="ob-art" aria-hidden="true">{s.art}</div>
              </div>
            </section>
          ))}
        </div>
      </div>
      <p className="sr-only" aria-live="polite">Slide {i + 1} of {OB_SLIDES.length}: {OB_SLIDES[i].title}</p>
      <div className="ob-foot">
        <div className="ob-nav">
          <button className="ob-arrow" aria-label="Previous slide" disabled={i === 0} onClick={() => go(i - 1)}><Icon name="back" size={20} /></button>
          <div className="ob-dots" role="group" aria-label="Choose slide">
            {OB_SLIDES.map((s, n) => <button key={n} aria-label={`Slide ${n + 1}: ${s.title}`} aria-current={n === i ? 'step' : undefined} onClick={() => go(n)} />)}
          </div>
          <button className="ob-arrow" aria-label="Next slide" disabled={i === last} onClick={() => go(i + 1)}><Icon name="arrow" size={20} /></button>
        </div>
        <button className="btn btn-yellow btn-lg btn-block" onClick={A.introSetup}>Set up my shop</button>
        <button className="link-btn ob-demo" onClick={A.introDemo}>Just looking? Explore the demo shop</button>
      </div>
    </div>
  );
}

function SetupScreen({ ctx }) {
  const { A, nav, notify, setSheet } = ctx;
  const [step, setStep] = useState(1);
  const [f, setF] = useState({ businessName: '', logoInitials: '', phone: '', bankName: '', accountNumber: '', accountName: '' });
  const [err, setErr] = useState({});
  const set = p => setF(x => ({ ...x, ...p }));
  useEffect(() => { const h = document.querySelector('main h1'); h && h.focus({ preventScroll: true }); }, [step]);
  function next() {
    const e = validateSeller(f, step); setErr(e);
    if (Object.keys(e).length) { setTimeout(() => { const el = document.querySelector('main [aria-invalid="true"]'); el && el.focus(); }, 30); return; }
    if (step === 1) { if (!f.accountName) set({ accountName: f.businessName.trim() }); setStep(2); return; }
    A.setSeller({ ...f, businessName: f.businessName.trim(), accountNumber: f.accountNumber.replace(/\s/g, ''), logoInitials: initialsOf(f.businessName), defaultReminderTone: 'friendly' });
    nav.reset({ name: 'home' });
    notify('You’re all set!');
  }
  return (
    <div className="screen">
      <div className="setup-top on-dark">
        <svg className="hero-shape" style={{ right: -20, top: -24 }} width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="46" fill="#9A0F5D" /></svg>
        <svg className="hero-shape" style={{ right: 70, bottom: 14 }} width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="3" width="28" height="28" rx="8" fill="#D3F6C0" stroke="#23221F" strokeWidth="1.5" transform="rotate(14 17 17)" /></svg>
        <div className="steps" aria-hidden="true"><span className="on" /><span className={step === 2 ? 'on' : ''} /></div>
        <p>Step {step} of 2</p>
        <h1 tabIndex={-1}>{step === 1 ? 'Let’s set up your shop' : 'Where should customers pay?'}</h1>
        <p>{step === 1 ? 'This takes about a minute. Customers see these details on every request.' : 'These details go on every payment request, so customers can copy them straight into their bank app.'}</p>
      </div>
      <form className="form-section" onSubmit={e => { e.preventDefault(); next(); }} noValidate>
        <SellerFields f={f} set={set} err={err} only={step} />
        <div className="stack" style={{ marginTop: 6 }}>
          <button type="submit" className="btn btn-yellow btn-lg btn-block">{step === 1 ? 'Next: bank details' : 'Finish setup'} <Icon name="chevron" /></button>
          {step === 2 && <button type="button" className="btn btn-block" onClick={() => setStep(1)}><Icon name="back" /> Back</button>}
        </div>
      </form>
      <p style={{ textAlign: 'center' }}>
        <button className="link-btn" onClick={() => setSheet({ type: 'confirm', title: 'Load demo data?', body: 'Explore with a sample crochet shop, Mimi Crochets, with 12 orders and 9 customers.', confirmLabel: 'Load demo data', onConfirm: A.resetDemo })}>Just exploring? Load demo data</button>
      </p>
    </div>
  );
}

function SettingsScreen({ ctx }) {
  const { state, A, notify, setSheet } = ctx;
  const s = state.seller;
  const [f, setF] = useState({ businessName: s.businessName, logoInitials: s.logoInitials || '', phone: s.phone || '', bankName: s.bankName, accountNumber: s.accountNumber, accountName: s.accountName });
  const [err, setErr] = useState({});
  const set = p => setF(x => ({ ...x, ...p }));
  const dirty = Object.keys(f).some(k => (f[k] || '') !== (s[k] || ''));
  function save() {
    const e = validateSeller(f); setErr(e);
    if (Object.keys(e).length) { notify('Check the highlighted fields'); setTimeout(() => { const el = document.querySelector('main [aria-invalid="true"]'); el && el.focus(); }, 30); return; }
    A.setSeller({ ...s, ...f, businessName: f.businessName.trim(), logoInitials: (f.logoInitials.trim() || initialsOf(f.businessName)).toUpperCase(), accountNumber: f.accountNumber.replace(/\s/g, '') });
    notify('Settings saved');
  }
  return (
    <div className="screen">
      <TopBar title="Settings" />
      {!C.Store.persistent && <div className="callout warn"><Icon name="alert" size={20} /><span>Your browser is blocking storage, so changes only last until you close this tab.</span></div>}
      <form onSubmit={e => { e.preventDefault(); save(); }} noValidate>
        <section className="form-section" aria-labelledby="h-shop"><h2 id="h-shop">Your shop</h2><SellerFields f={f} set={set} err={err} only={1} /><Field id="s-logoInitials" label="Logo initials"><input id="s-logoInitials" className="input" maxLength={3} value={f.logoInitials} onChange={e => set({ logoInitials: e.target.value })} /></Field></section>
        <section className="form-section" aria-labelledby="h-bank"><h2 id="h-bank">Bank details</h2><SellerFields f={f} set={set} err={err} only={2} /></section>
        <button type="submit" className="btn btn-yellow btn-block btn-lg" disabled={!dirty}><Icon name="check" /> {dirty ? 'Save changes' : 'All changes saved'}</button>
      </form>
      <section className="form-section" style={{ marginTop: 20 }} aria-labelledby="h-tone">
        <h2 id="h-tone">Default reminder tone</h2>
        <Seg label="Default reminder tone" value={s.defaultReminderTone} onChange={t => { A.setSeller({ ...s, defaultReminderTone: t }); notify(`Reminders will start ${t}`); }} options={TONES.map(t => ({ value: t.id, label: t.label }))} />
        <p className="hint" style={{ marginTop: 8 }}>You can still switch tone on each reminder.</p>
      </section>
      <section className="form-section" aria-labelledby="h-demo">
        <h2 id="h-demo">Demo</h2>
        <div className="stack">
          <button className="btn btn-block" onClick={() => setSheet({ type: 'confirm', danger: true, title: 'Reset demo data?', body: 'This replaces everything with the Mimi Crochets sample shop. Any orders you added will be lost.', confirmLabel: 'Reset demo data', onConfirm: () => { A.resetDemo(); notify('Demo data restored'); } })}><Icon name="refresh" /> Reset demo data</button>
          <button className="btn btn-block" onClick={A.replayIntro}><Icon name="refresh" /> Replay intro</button>
          <button className="btn btn-block" onClick={() => setSheet({ type: 'confirm', danger: true, title: 'Start fresh?', body: 'This clears all shop details, customers and orders, then shows the intro and first-run setup.', confirmLabel: 'Clear everything', onConfirm: A.startFresh })}><Icon name="trash" /> Start fresh (first-run setup)</button>
        </div>
      </section>
      <p className="settings-foot">Everything is stored on this device only. Nothing is sent anywhere unless you share it.</p>
    </div>
  );
}

function NotFound({ nav }) {
  return <div className="screen"><TopBar title="Not found" onBack={nav.back} /><Empty title="This order no longer exists">It may have been deleted.</Empty></div>;
}

/* =========================================================================
   App root
   ========================================================================= */
// Prototype behaviour: the intro opens on every load (introSeen is reset here),
// so anyone opening the link — or reloading during a demo — starts at onboarding.
// "Explore the demo shop" keeps whatever data is already saved.
function loadState() {
  const s = C.Store.get(KEY);
  if (s && s.version === 1 && Array.isArray(s.orders)) return { ...s, introSeen: false };
  const fresh = C.buildSample(C.todayISO()); // first load: preload demo shop
  C.Store.set(KEY, fresh);
  return { ...fresh, introSeen: false };
}

function App() {
  const today = C.todayISO();
  const [state, setState] = useState(loadState);
  useEffect(() => { C.Store.set(KEY, state); }, [state]);
  const [stack, setStack] = useState(() => [{ name: state.seller ? 'home' : 'setup' }]);
  const route = stack[stack.length - 1];
  const [toast, setToast] = useState(null);
  const [sheet, setSheet] = useState(null);
  const timer = useRef(null);
  const notify = msg => { clearTimeout(timer.current); setToast({ msg, key: Date.now() }); timer.current = setTimeout(() => setToast(null), 3000); };

  const nav = useMemo(() => ({
    go: r => setStack(s => [...s, r]),
    back: () => setStack(s => s.length > 1 ? s.slice(0, -1) : [{ name: 'home' }]),
    tab: n => setStack([{ name: n }]),
    reset: r => setStack([r]),
    replace: r => setStack(s => [...s.slice(0, -1), r]),
    // After saving the create form: return to an existing preview of this order, or replace the form with one
    finishCreate: id => setStack(s => {
      const prev = s[s.length - 2];
      if (prev && prev.name === 'preview' && prev.orderId === id) return s.slice(0, -1);
      return [...s.slice(0, -1), { name: 'preview', orderId: id }];
    })
  }), []);

  const A = {
    createOrder(data) {
      const id = C.uid('o');
      setState(s => ({ ...s, nextNumber: s.nextNumber + 1, orders: [...s.orders, { ...data, id, number: C.invNumber(s.nextNumber), payments: [], createdAt: today, sharedAt: null, deliveredAt: null }] }));
      return id;
    },
    addCustomer(c) { const id = C.uid('c'); setState(s => ({ ...s, customers: [...s.customers, { ...c, id, createdAt: today }] })); return id; },
    patchOrder(id, patch) { setState(s => ({ ...s, orders: s.orders.map(o => o.id === id ? { ...o, ...(typeof patch === 'function' ? patch(o) : patch) } : o) })); },
    deleteOrder(id) { setState(s => ({ ...s, orders: s.orders.filter(o => o.id !== id) })); }, // nextNumber is untouched, so numbers are never reused
    setSeller(seller) { setState(s => ({ ...s, seller })); },
    resetDemo() { setState({ ...C.buildSample(today), introSeen: true }); nav.reset({ name: 'home' }); },
    startFresh() { setState(C.emptyState()); nav.reset({ name: 'setup' }); },
    replayIntro() { setState(s => ({ ...s, introSeen: false })); },
    // Intro → explore: keep any shop that exists, otherwise load the demo
    introDemo() {
      if (state.seller) { setState(s => ({ ...s, introSeen: true })); nav.reset({ name: 'home' }); }
      else A.resetDemo();
    },
    // Intro → set up: start from an empty shop. If the seller has their own data, confirm first.
    introSetup() {
      const ownData = state.seller && (state.seller.businessName !== 'Mimi Crochets' || state.orders.some(o => !/^o\d+$/.test(o.id)));
      const begin = () => { setState({ ...C.emptyState(), introSeen: true }); nav.reset({ name: 'setup' }); };
      if (ownData) setSheet({ type: 'confirm', danger: true, title: 'Set up a new shop?', body: `This replaces ${state.seller.businessName} and its orders on this device.`, confirmLabel: 'Start new shop', onConfirm: begin });
      else begin();
    }
  };

  const orderById = id => state.orders.find(o => o.id === id);
  const custById = id => state.customers.find(c => c.id === id);
  const ctx = { state, today, nav, A, notify, setSheet, orderById, custById };

  const routeKey = stack.length + ':' + route.name + ':' + (route.orderId || route.customerId || route.filter || '');
  useEffect(() => {
    window.scrollTo(0, 0);
    const h = document.querySelector('main h1');
    if (h && stack.length + (route.name === 'home' ? 0 : 1) > 1) h.focus({ preventScroll: true });
  }, [routeKey]);

  const needsOrder = ['preview', 'order', 'reminder', 'receipt'].includes(route.name) || (route.name === 'create' && route.orderId);
  let screen;
  const showIntro = !state.introSeen;
  if (showIntro) screen = <Onboarding ctx={ctx} />;
  else if (!state.seller) screen = <SetupScreen ctx={ctx} />;
  else if (needsOrder && (!orderById(route.orderId) || !custById(orderById(route.orderId).customerId))) screen = <NotFound nav={nav} />;
  else if (route.name === 'customer' && !custById(route.customerId)) screen = <NotFound nav={nav} />;
  else switch (route.name) {
    case 'home': screen = <Dashboard ctx={ctx} />; break;
    case 'orders': screen = <OrdersScreen key={routeKey} ctx={ctx} filter={route.filter} />; break;
    case 'customers': screen = <CustomersScreen ctx={ctx} />; break;
    case 'settings': screen = <SettingsScreen ctx={ctx} />; break;
    case 'create': screen = <CreateScreen key={routeKey} ctx={ctx} orderId={route.orderId} customerId={route.customerId} />; break;
    case 'preview': screen = <PreviewScreen ctx={ctx} orderId={route.orderId} />; break;
    case 'order': screen = <OrderScreen ctx={ctx} orderId={route.orderId} />; break;
    case 'reminder': screen = <ReminderScreen key={routeKey} ctx={ctx} orderId={route.orderId} />; break;
    case 'receipt': screen = <ReceiptScreen ctx={ctx} orderId={route.orderId} />; break;
    case 'customer': screen = <CustomerScreen ctx={ctx} customerId={route.customerId} />; break;
    default: screen = <Dashboard ctx={ctx} />;
  }
  const showNav = !showIntro && !!state.seller && TABS.some(t => t.id === route.name);
  const hasBar = !showIntro && !!state.seller && route.name === 'create';
  const sheetOrder = sheet && sheet.type === 'payment' && orderById(sheet.orderId);

  return (
    <div className="app">
      <a className="skip" href="#main">Skip to content</a>
      <main id="main" key={routeKey} className={showNav ? 'with-nav' : hasBar ? 'with-bar' : ''}>{screen}</main>
      {showNav && <BottomNav active={route.name} nav={nav} overdue={state.orders.filter(o => C.daysLate(o, today) > 0).length} />}
      {sheetOrder && <PaymentSheet ctx={ctx} order={sheetOrder} onClose={() => setSheet(null)} />}
      {sheet && sheet.type === 'confirm' && <ConfirmSheet s={sheet} onClose={() => setSheet(null)} />}
      <div className={'fixed-col toast-wrap' + (showNav ? ' above-nav' : hasBar ? ' above-bar' : '')} role="status" aria-live="polite">
        {toast && <div className="toast" key={toast.key}><Icon name="check" size={18} />{toast.msg}</div>}
      </div>
      <aside className="desk-note" aria-hidden="true">
        <svg className="desk-badge" viewBox="0 0 132 132">
          <defs><path id="ring" d="M66 66m-48 0a48 48 0 1 1 96 0a48 48 0 1 1-96 0" /></defs>
          <circle cx="66" cy="66" r="66" fill="#9A0F5D" />
          <text fill="#FFF3E3" fontFamily="Archivo Black" fontSize="13" letterSpacing="1.5"><textPath href="#ring">ORDERS · DEPOSITS · BALANCES · PAID ·</textPath></text>
          <text x="66" y="80" textAnchor="middle" fill="#FFF3E3" fontFamily="Archivo Black" fontSize="40">₦</text>
        </svg>
        <h2>Orders, not invoices.</h2>
        <p>One order, one customer, several payments over time. The app makes the payment request and the receipt from it.</p>
        <p>Data lives in this browser only. Reset it any time from Settings.</p>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
