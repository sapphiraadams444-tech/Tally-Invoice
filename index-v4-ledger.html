<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F1">
<title>Tally — order payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Inter subset just for the ₦ glyph, as a fallback if Onest lacks it -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&text=%E2%82%A6&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   "Calm ledger" — grey canvas, white paper cards, serif money, one blue accent
   ========================================================================== */
:root{
  --bg:#F3F3F1; --bg-2:#ECECE9; --card:#FFFFFF; --ink:#16161A; --ink-2:#3A3A40; --muted:#64646C; --faint:#A3A3AA;
  --line:#E8E8E5; --soft:#EEEEEC; --soft-2:#E5E5E2;
  --blue:#2F6FEB; --blue-dark:#2259CC; --blue-tint:#EAF0FD;
  --ok:#1C7343; --ok-tint:#E6F4EB; --ok-line:#C3E4CF;
  --err:#B42318; --err-tint:#FCEBE8; --err-line:#F5C9C2; --err-bar:#E5533F;
  --r-card:26px; --r-in:16px;
  --sh-1:0 1px 1px rgba(22,22,26,.03), 0 2px 6px -2px rgba(22,22,26,.05);
  --sh-2:0 1px 1px rgba(22,22,26,.03), 0 10px 30px -14px rgba(22,22,26,.16);
  --sh-3:0 18px 50px -18px rgba(22,22,26,.28);
  --font:'Onest','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--font);font-weight:600;letter-spacing:-0.018em;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;-webkit-tap-highlight-color:transparent}
::selection{background:var(--blue-tint)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:14px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:100;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.cap{font-size:13px;color:var(--muted)}

/* Money: serif numerals with a small raised naira sign */
.amt{font-family:var(--serif);font-weight:400;letter-spacing:-0.01em;font-variant-numeric:lining-nums;white-space:nowrap}
.amt .cur{font-family:var(--font);font-size:.42em;font-weight:500;vertical-align:.78em;margin-right:.12em;color:var(--muted);letter-spacing:0}

/* ---------- Shell ---------- */
.app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg);
  background-image:radial-gradient(120% 50% at 50% 0%, #FFFFFF 0%, rgba(255,255,255,0) 60%)}
main{padding:0 20px 40px}
main.with-nav{padding-bottom:128px}
main.with-bar{padding-bottom:180px}
.fixed-col{position:fixed;left:0;right:0;margin:0 auto;max-width:430px;z-index:20}
.desk-note{display:none}
@media (min-width:900px){
  body{background:#DCE6EE;background-image:radial-gradient(80% 60% at 20% 10%, #EEF3F7 0%, transparent 60%),radial-gradient(60% 60% at 85% 90%, #EFE9E6 0%, transparent 60%)}
  body{background-attachment:fixed}
  .app{margin:28px auto;min-height:calc(100vh - 56px);border-radius:46px;box-shadow:0 0 0 8px rgba(255,255,255,.55), 0 40px 90px -30px rgba(30,50,70,.45);overflow:clip}
}
@media (min-width:1180px){
  .desk-note{display:block;position:fixed;left:calc(50% - 215px - 310px);top:72px;width:250px;font-size:15px;color:var(--ink-2)}
  .desk-note h2{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.01em;margin-bottom:16px;color:var(--ink)}
  .desk-note p{margin-bottom:12px}
  .desk-note .tag{display:inline-block;background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:18px}
}

/* ---------- Motion: staggered entrance ---------- */
.screen > *{animation:rise .55s var(--ease) both}
.screen > *:nth-child(2){animation-delay:.04s}
.screen > *:nth-child(3){animation-delay:.08s}
.screen > *:nth-child(4){animation-delay:.12s}
.screen > *:nth-child(5){animation-delay:.16s}
.screen > *:nth-child(6){animation-delay:.2s}
.screen > *:nth-child(n+7){animation-delay:.24s}
.screen > .fixed-col{animation:barIn .45s var(--ease) both .1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes barIn{from{transform:translateY(100%)}to{transform:none}}

/* ---------- Top bar: frosted, sticky, centred title ---------- */
.topbar{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:minmax(48px,auto) 1fr minmax(48px,auto);align-items:center;gap:8px;min-height:72px;margin:0 -20px 4px;padding:0 20px;
  background:rgba(243,243,241,.82);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px)}
.topbar h1{font-size:17px;font-weight:600;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:2}
.topbar > :last-child:not(h1){grid-column:3;justify-self:end}
.topbar > button:first-child{grid-column:1}
.icon-btn{width:48px;height:48px;min-width:44px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);transition:transform .15s var(--ease), box-shadow .15s}
.icon-btn:hover{box-shadow:var(--sh-2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.plain{background:transparent;box-shadow:none;width:44px;height:44px;color:var(--muted)}
.icon-btn.plain:hover{color:var(--err)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:999px;font-weight:500;font-size:16px;background:var(--card);color:var(--ink);box-shadow:var(--sh-1);text-decoration:none;transition:background .15s, transform .15s var(--ease), box-shadow .15s;text-align:center;line-height:1.15;letter-spacing:-.005em}
.btn:hover:not(:disabled){box-shadow:var(--sh-2)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.45}
.btn svg{flex-shrink:0}
.btn-yellow,.btn-ink,.btn-hero{background:var(--blue);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 8px 20px -8px rgba(47,111,235,.55)}
.btn-yellow:hover:not(:disabled),.btn-ink:hover:not(:disabled),.btn-hero:hover:not(:disabled){background:var(--blue-dark);box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 10px 24px -8px rgba(47,111,235,.6)}
.btn-danger{background:var(--err-tint);color:var(--err);box-shadow:none}
.btn-block{width:100%}
.btn-small{min-height:44px;padding:0 16px;font-size:14px}
.btn-lg{min-height:58px;font-weight:600}
.link-btn{min-height:44px;padding:0 4px;font-weight:500;color:var(--blue);display:inline-flex;align-items:center;gap:4px;font-size:15px}
.link-btn:hover{color:var(--blue-dark)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- Cards / pills ---------- */
.card{background:var(--card);border-radius:var(--r-card);padding:20px;box-shadow:var(--sh-1)}
.card + .card{margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:500;line-height:1.65;background:var(--card);color:var(--ink-2);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.big{font-size:14px;padding:5px 12px}
.pill-late{background:var(--err-tint);color:var(--err);border-color:var(--err-line)}
.st-draft{border-style:dashed;background:transparent;color:var(--muted)}
.st-paid{background:var(--ok-tint);color:var(--ok);border-color:var(--ok-line)}
.pills{display:inline-flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:var(--soft-2);color:var(--ink-2);font-size:12.5px;font-weight:600}
.badge.alert{background:var(--err-tint);color:var(--err)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:600;flex-shrink:0;color:var(--ink-2);letter-spacing:-.01em;box-shadow:inset 0 0 0 1px rgba(22,22,26,.05)}

/* ---------- Dashboard ---------- */
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:28px 0 22px}
.dash-head .hello{color:var(--muted);font-size:14px;font-weight:500}
.dash-head h1{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:-.01em;line-height:1;margin-top:6px}
.hero{background:var(--card);border-radius:30px;padding:22px 22px 20px;position:relative;box-shadow:var(--sh-2)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-label{font-size:14px;color:var(--muted);font-weight:500}
.hero-count{font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--soft);border-radius:999px;padding:3px 10px}
.hero-amt{font-size:68px;line-height:1;margin:14px 0 6px;color:var(--ink)}
.hero-amt .amt .cur{font-size:.32em;vertical-align:1.25em}
.hero-sub{color:var(--muted);font-size:14px}
.split{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--soft);margin:18px 0 0;gap:3px}
.split span{height:100%;border-radius:999px;transition:width .8s var(--ease)}
.split .s-late{background:var(--err-bar)}
.split .s-ok{background:var(--ink);flex:1}
.hero-pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.hero-pills .pill{all:unset;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);padding:2px 0}
.hero-pills .pill > span{display:inline-flex;align-items:center;gap:7px}
.hero-pills .pill > span::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--ink)}
.hero-pills .pill-late > span::before{background:var(--err-bar)}
.hero-pills button.pill{cursor:pointer;border-radius:12px;text-align:left}
.hero-pills button.pill:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hero-pills button.pill:focus-visible{outline:2.5px solid var(--blue);outline-offset:4px}
.hero-pills .pill b{color:var(--ink);font-size:17px;font-weight:600;letter-spacing:-.01em}
.hero-pills .pill-late b{color:var(--err)}
.hero-shape{display:none}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.earned{background:var(--card);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--sh-1);display:flex;flex-direction:column}
.earned .lbl{font-size:13px;color:var(--muted);font-weight:500}
.earned .amt-wrap{font-size:34px;line-height:1;margin:auto 0 6px;padding-top:14px}
.earned .sub{font-size:12.5px;color:var(--muted)}
.new-btn{background:var(--blue);color:#fff;border-radius:var(--r-card);padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-weight:600;font-size:17px;line-height:1.2;letter-spacing:-.01em;min-height:132px;box-shadow:0 14px 30px -14px rgba(47,111,235,.7);transition:background .15s, transform .15s var(--ease)}
.new-btn:hover{background:var(--blue-dark)}
.new-btn:active{transform:scale(.975)}
.new-btn .plus{width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease)}
.new-btn:hover .plus{transform:rotate(90deg)}
.section{margin-top:32px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 2px}
.section-head h2{font-size:17px}
.section-head .spacer{flex:1}
.ocard{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh-1)}
.ocard + .ocard{margin-top:12px}
.ocard-main{display:flex;gap:12px;width:100%;text-align:left;padding:18px 18px 14px;align-items:center;transition:background .15s}
.ocard-main:hover{background:#FCFCFB}
.ocard-body{flex:1;min-width:0;display:block}
.ocard-name{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em}
.ocard-sub{display:block;color:var(--muted);font-size:13.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard-end{text-align:right;flex-shrink:0}
.ocard-amt{display:block;font-size:30px;line-height:1}
.ocard-kind{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.ocard-foot{padding:0 18px 18px;display:flex;align-items:center;gap:10px}
.ocard-foot .pill{flex-shrink:0}
.ocard-foot .btn{flex:1;min-height:46px;font-size:15px;background:var(--soft);box-shadow:none}
.ocard-foot .btn:hover:not(:disabled){background:var(--soft-2);box-shadow:none}

/* ---------- Rows / lists ---------- */
.list{background:var(--card);border-radius:var(--r-card);overflow:hidden;padding:4px 0;box-shadow:var(--sh-1)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;min-height:68px;background:transparent;position:relative;transition:background .15s}
.row + .row::before{content:"";position:absolute;top:0;left:70px;right:18px;height:1px;background:var(--line)}
.row:hover{background:#FAFAF9}
.row-main{flex:1;min-width:0;display:block}
.row-title{display:block;font-weight:500;letter-spacing:-.005em}
.row-sub{display:block;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.row-end{text-align:right;display:block;flex-shrink:0}
.row-amt{display:block;font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row-kind{display:block;font-size:12.5px;color:var(--muted)}
.row-chev{color:var(--faint);flex-shrink:0}

/* ---------- Empty states ---------- */
.empty{text-align:center;padding:28px 22px 26px;background:transparent;border:1.5px dashed var(--soft-2);border-radius:var(--r-card)}
.empty h3{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.005em;margin:12px 0 4px}
.empty p{color:var(--muted);font-size:14.5px;max-width:30ch;margin:0 auto}
.empty .btn{margin-top:16px}
.empty-hero{text-align:center;padding:24px 4px}
.empty-hero h2{font-family:var(--serif);font-weight:400;font-size:40px;letter-spacing:-.01em;margin:22px 0 10px}
.empty-hero p{color:var(--muted);max-width:32ch;margin:0 auto 26px}

/* ---------- Forms ---------- */
.form-section{background:var(--card);border-radius:var(--r-card);padding:20px;margin-bottom:12px;box-shadow:var(--sh-1)}
.form-section > h2{font-size:17px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field > label,.flabel{font-size:13.5px;color:var(--muted);font-weight:500}
.input,.textarea,.select{width:100%;min-height:52px;border:1.5px solid transparent;border-radius:var(--r-in);padding:10px 15px;background:var(--bg);font-size:16px;transition:border-color .15s, background .15s, box-shadow .15s}
.input::placeholder,.textarea::placeholder,.affix input::placeholder{color:var(--faint)}
.input:hover,.textarea:hover,.affix:hover{border-color:var(--soft-2)}
.textarea{min-height:230px;resize:vertical;line-height:1.6}
.input[aria-invalid="true"],.affix[data-invalid="true"]{border-color:var(--err);background:#FFF9F8}
.input:focus-visible,.textarea:focus-visible,.affix:focus-within{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px var(--blue-tint)}
.affix{display:flex;align-items:center;border:1.5px solid transparent;border-radius:var(--r-in);background:var(--bg);min-height:52px;padding:0 15px;gap:6px;transition:border-color .15s, background .15s, box-shadow .15s}
.affix input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;padding:10px 0;font-variant-numeric:tabular-nums}
.affix span{color:var(--muted);font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.error{font-size:13.5px;color:var(--err);font-weight:500;display:flex;gap:6px;align-items:flex-start;animation:rise .25s var(--ease)}
.error svg{flex-shrink:0;margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:4px 20px 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--card);font-weight:500;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh-1);transition:background .15s, color .15s;scroll-snap-align:start}
.form-section .chip,.sheet .chip{background:var(--bg);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip .count{font-size:12px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .count{color:#9E9EA6}
.seg{display:flex;border-radius:999px;padding:4px;background:var(--bg);gap:4px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:500;font-size:14px;padding:0 10px;color:var(--muted);transition:background .2s, color .2s, box-shadow .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06), 0 2px 8px -2px rgba(0,0,0,.08)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.switch-row .flabel{color:var(--ink);font-size:15px}
.switch{width:52px;height:32px;border-radius:999px;background:var(--soft-2);position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch-wrap{min-width:52px;min-height:44px;display:flex;align-items:center}
.item-row{border-radius:20px;padding:14px;margin-bottom:12px;background:var(--bg);animation:rise .35s var(--ease)}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-left:2px}
.item-head .flabel{font-weight:600;color:var(--ink);font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.item-controls{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-top:10px}
.item-row .input,.item-row .affix,.item-row .stepper{background:#fff}
.line-total{font-size:13px;color:var(--muted);text-align:right;margin-top:8px}
.line-total b{color:var(--ink);font-weight:600}
.stepper{display:flex;align-items:center;border-radius:999px;background:var(--bg);height:52px;padding:0 2px}
.stepper button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;transition:background .15s}
.stepper button:hover:not(:disabled){background:var(--soft)}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.picker-list{border-radius:var(--r-in);overflow:hidden;margin-top:10px;background:var(--bg)}
.picker-list .row{min-height:58px;padding:8px 14px}
.picker-list .row + .row::before{left:62px;right:14px}
.picked{display:flex;align-items:center;gap:12px;border-radius:var(--r-in);padding:10px 10px 10px 12px;background:var(--bg)}
.breakdown div{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.breakdown div span:last-child{color:var(--ink)}
.breakdown div.total{color:var(--ink);font-weight:600;font-size:17px;border-top:1.5px dashed var(--soft-2);margin-top:10px;padding-top:16px}

<!-- =========================================================================
     STAGE 1 — Core: dates, money, storage, calculations, status, messages,
     sample data. Plain JS (no JSX) so it can also be tested in Node.
     ========================================================================= -->
<script id="core">
(function (root) {
  'use strict';
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // ---- Dates: stored as local 'YYYY-MM-DD' strings ----
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return toISO(new Date()); }
  function parseISO(s) { var p = String(s).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); }
  function diffDays(a, b) { // a − b, in whole days
    var A = parseISO(a), B = parseISO(b);
    return Math.round((Date.UTC(A.getFullYear(), A.getMonth(), A.getDate()) - Date.UTC(B.getFullYear(), B.getMonth(), B.getDate())) / 86400000);
  }
  function fmtDate(s) { var d = parseISO(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function fmtShort(s) { var d = parseISO(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function fmtLong(s) { var d = parseISO(s); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function monthName(s) { return MONTHS_LONG[parseISO(s).getMonth()]; }
  function relDays(date, today) {
    var d = diffDays(date, today);
    if (d === 0) return 'today';
    if (d === 1) return 'tomorrow';
    if (d > 1) return 'in ' + d + ' days';
    if (d === -1) return 'yesterday';
    return (-d) + ' days ago';
  }

  // ---- Money: integers in naira ----
  function commas(n) { return String(Math.abs(Math.round(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function naira(n) { return (n < 0 ? '−' : '') + '₦' + commas(n); }

  // ---- Phones: '0803 123 4567' -> '2348031234567' ----
  function toWaNumber(phone) {
    var d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('234') === 0) return d;
    if (d.charAt(0) === '0') return '234' + d.slice(1);
    if (d.length === 10) return '234' + d;
    return d;
  }
  function waLink(phone, text) { return 'https://wa.me/' + toWaNumber(phone) + '?text=' + encodeURIComponent(text); }

  // ---- IDs / numbering ----
  function uid(prefix) { return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function invNumber(n) { return 'INV-' + String(n).padStart(4, '0'); }

  // ---- Calculations (never stored) ----
  function subtotal(o) { return (o.items || []).reduce(function (s, i) { return s + (i.quantity || 0) * (i.unitPrice || 0); }, 0); }
  function discountAmount(o) {
    var st = subtotal(o), d = o.discount;
    if (!d || !d.value) return 0;
    var v = d.type === 'percent' ? Math.round(st * Math.min(d.value, 100) / 100) : d.value;
    return Math.min(v, st);
  }
  function total(o) { return subtotal(o) - discountAmount(o) + (o.deliveryFee || 0); }
  function paid(o) { return (o.payments || []).reduce(function (s, p) { return s + p.amount; }, 0); }
  function balance(o) { return total(o) - paid(o); }

  // status: 'draft' | 'deposit' (Awaiting deposit) | 'balance' (Balance due) | 'paid' (Fully paid)
  function status(o) {
    if (!o.sharedAt) return 'draft';
    if (balance(o) <= 0) return 'paid';
    if (o.depositRequired > 0 && paid(o) < o.depositRequired) return 'deposit';
    return 'balance';
  }
  function isOpen(o) { var s = status(o); return s === 'deposit' || s === 'balance'; }
  // Overdue is a flag, not a status
  function daysLate(o, today) {
    if (!isOpen(o)) return 0;
    var d = diffDays(today, o.deadline);
    return d > 0 ? d : 0;
  }
  function lateLabel(n) { return n === 1 ? '1 day late' : n + ' days late'; }
  // What the customer should pay right now
  function dueNow(o) {
    var p = paid(o), b = balance(o);
    if (b <= 0) return { kind: 'none', amount: 0 };
    if (o.depositRequired > 0 && p < o.depositRequired) return { kind: 'deposit', amount: Math.min(o.depositRequired - p, b) };
    if (o.depositRequired === 0 && p === 0) return { kind: 'full', amount: b };
    return { kind: 'balance', amount: b };
  }
  function orderTitle(o) {
    if (!o.items || !o.items.length) return 'Untitled order';
    return o.items.map(function (i) { return i.quantity > 1 ? i.quantity + ' × ' + i.name : i.name; }).join(' + ');
  }
  function firstName(c) { return c && c.name ? c.name.trim().split(/\s+/)[0] : 'there'; }

  function sortOrders(list, today) {
    return list.slice().sort(function (a, b) {
      var la = daysLate(a, today), lb = daysLate(b, today);
      if (la !== lb) return lb - la; // most days late first
      var oa = isOpen(a) ? 0 : status(a) === 'draft' ? 1 : 2;
      var ob = isOpen(b) ? 0 : status(b) === 'draft' ? 1 : 2;
      if (oa !== ob) return oa - ob;
      if (oa === 0) return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
      return a.number < b.number ? 1 : -1; // newest first
    });
  }

  function summary(state, today) {
    var open = state.orders.filter(isOpen);
    var owed = 0, overdue = 0, overdueCount = 0;
    open.forEach(function (o) {
      var b = balance(o); owed += b;
      if (daysLate(o, today) > 0) { overdue += b; overdueCount++; }
    });
    var month = today.slice(0, 7), earned = 0, paymentsCount = 0;
    state.orders.forEach(function (o) {
      (o.payments || []).forEach(function (p) { if (p.date.slice(0, 7) === month) { earned += p.amount; paymentsCount++; } });
    });
    return { owed: owed, openCount: open.length, overdue: overdue, overdueCount: overdueCount, notDue: owed - overdue, earned: earned, paymentsCount: paymentsCount };
  }

  function customerStats(state, customerId) {
    var orders = state.orders.filter(function (o) { return o.customerId === customerId; });
    var spent = 0, owed = 0;
    orders.forEach(function (o) { spent += paid(o); if (isOpen(o)) owed += balance(o); });
    return { orders: orders, spent: spent, owed: owed };
  }

  // ---- Messages (plain text, so customers can copy amounts + account numbers) ----
  function bankLines(s) { return ['Bank: ' + s.bankName, 'Account: ' + s.accountNumber, 'Name: ' + s.accountName]; }
  function requestMessage(o, c, s) {

      </div>
    </Sheet>
  );
}

        </div>
        <p className="hero-amt"><Amount value={sum.owed} /></p>
        <p className="hero-sub">{sum.openCount ? `across ${sum.openCount} open order${sum.openCount === 1 ? '' : 's'}` : 'You’re all caught up'}</p>

      </section>

      <div className="dash-row">
        <div className="earned">
          <p className="lbl">Earned in {C.monthName(today)}</p>
          <p className="amt-wrap"><Amount value={sum.earned} /></p>
          <p className="sub">{sum.paymentsCount} payment{sum.paymentsCount === 1 ? '' : 's'} received</p>

        <button className="new-btn" onClick={() => nav.go({ name: 'create' })}>
          <span className="plus"><Icon name="plus" /></span>

      <section className="section" aria-labelledby="sec-overdue">

        </div>
        {awaiting.length
          ? <div className="list">{awaiting.slice(0, 4).map(o => {
              const due = C.dueNow(o);
              return <OrderRow key={o.id} o={o} ctx={ctx} subtitle={`${KIND_LABEL[due.kind]} due ${C.relDays(o.deadline, today)} · ${C.fmtDate(o.deadline)}`} />;
            })}</div>
          : <Empty title="No payments waiting">When you send a request, it shows here until it’s paid.</Empty>}

    </div>
  );
}

/* =========================================================================
   STAGE 3 — Create request → Preview & share
   ========================================================================= */
function newItem() { return { key: C.uid('i'), name: '', quantity: 1, unitPrice: 0 }; }
function initForm(o, customerId, today) {
  if (o) {
    const tot = C.total(o);
    return {
      customerId: o.customerId, newCustomer: null, query: '',
      items: o.items.map(i => ({ ...i, key: C.uid('i') })),
      deliveryFee: o.deliveryFee, discountOn: !!(o.discount && o.discount.value),
      discount: o.discount && o.discount.value ? { ...o.discount } : { type: 'amount', value: 0 },
      depositMode: o.depositRequired === 0 ? 'none' : o.depositRequired === Math.round(tot / 2) ? 'half' : 'custom',
      depositCustom: o.depositRequired, deadline: o.deadline
    };
  }
  return {
    customerId: customerId || null, newCustomer: null, query: '', items: [newItem()],
    deliveryFee: 0, discountOn: false, discount: { type: 'amount', value: 0 },
    depositMode: 'half', depositCustom: 0, deadline: C.addDays(today, 7)
  };
}

function CustomerPicker({ ctx, f, set, error }) {
  const { state } = ctx;
  const picked = f.customerId && ctx.custById(f.customerId);
  if (picked) {
    return (
      <div className="picked">
        <Avatar name={picked.name} id={picked.id} size={40} />
        <div style={{ flex: 1, minWidth: 0 }}><b>{picked.name}</b><div className="hint">{picked.instagramHandle || picked.phone}</div></div>
        <button type="button" className="btn btn-small" onClick={() => set({ customerId: null })}>Change</button>
      </div>
    );
  }
  if (f.newCustomer) {
    const nc = f.newCustomer;
    const upd = p => set({ newCustomer: { ...nc, ...p } });
    return (
      <div>
        <Field id="nc-name" label="Customer name" error={error}>
          <input id="nc-name" className="input" value={nc.name} autoComplete="off" aria-invalid={error ? 'true' : undefined} aria-describedby={error ? 'nc-name-err' : undefined} onChange={e => upd({ name: e.target.value })} placeholder="e.g. Amaka Obi" />
        </Field>
        <Field id="nc-phone" label="WhatsApp number" hint="Used to open WhatsApp chats. Optional." error={ctx.errors && ctx.errors.newPhone}>
          <input id="nc-phone" className="input" type="tel" inputMode="tel" value={nc.phone} aria-invalid={ctx.errors && ctx.errors.newPhone ? 'true' : undefined} aria-describedby={ctx.errors && ctx.errors.newPhone ? 'nc-phone-err' : 'nc-phone-hint'} onChange={e => upd({ phone: e.target.value })} placeholder="0803 123 4567" />
        </Field>
        <Field id="nc-ig" label="Instagram handle" hint="Optional.">
          <input id="nc-ig" className="input" value={nc.handle} autoCapitalize="none" aria-describedby="nc-ig-hint" onChange={e => upd({ handle: e.target.value })} placeholder="@handle" />
        </Field>
        {state.customers.length > 0 && <button type="button" className="link-btn" onClick={() => set({ newCustomer: null })}>Pick a saved customer instead</button>}
      </div>
    );
  }
  const q = f.query.trim().toLowerCase();
  const list = state.customers
    .filter(c => !q || c.name.toLowerCase().includes(q) || (c.instagramHandle || '').toLowerCase().includes(q) || (c.phone || '').replace(/\D/g, '').includes(q.replace(/\D/g, '') || '~'))
    .sort((a, b) => a.name.localeCompare(b.name)).slice(0, 5);
  return (
    <div>
      <div className="field" style={{ marginBottom: 0 }}>
        <label htmlFor="cust-search">Search saved customers</label>
        <div className="search" style={{ marginBottom: 0 }}>
          <Icon name="search" size={20} />
          <input id="cust-search" className="input" type="search" autoComplete="off" value={f.query} placeholder="Name, @handle or phone"
            aria-invalid={error ? 'true' : undefined} aria-describedby={error ? 'cust-search-err' : undefined}
            onChange={e => set({ query: e.target.value })} />
        </div>
        {error && <p className="error" id="cust-search-err"><Icon name="alert" size={16} />{error}</p>}
      </div>
      {list.length > 0 && (
        <div className="picker-list" role="list" aria-label="Matching customers">
          {list.map(c => (
            <button type="button" role="listitem" key={c.id} className="row" onClick={() => set({ customerId: c.id, query: '' })}>
              <Avatar name={c.name} id={c.id} size={36} />
              <span className="row-main"><span className="row-title">{c.name}</span><span className="row-sub">{c.instagramHandle}</span></span>
              <Icon name="plus" size={20} className="row-chev" />
            </button>
          ))}
        </div>
      )}
      {q && !list.length && <p className="hint" style={{ marginTop: 8 }}>No saved customer matches “{f.query}”.</p>}
      <button type="button" className="btn btn-small" style={{ marginTop: 12 }}
        onClick={() => set({ newCustomer: { name: /^[@\d]/.test(f.query) ? '' : f.query, phone: '', handle: f.query.startsWith('@') ? f.query : '' }, query: '' })}>
        <Icon name="plus" size={18} /> Add new customer
      </button>
    </div>
  );
}

function CreateScreen({ ctx, orderId, customerId }) {
  const { today, nav, A, notify } = ctx;
  const existing = orderId ? ctx.orderById(orderId) : null;
  const [f, setF] = useState(() => initForm(existing, customerId, today));
  const [tried, setTried] = useState(false);
  const [errors, setErrors] = useState({});
  const focusNewRow = useRef(false);
  const set = patch => setF(p => ({ ...p, ...patch }));
  const setItem = (i, patch) => setF(p => ({ ...p, items: p.items.map((it, j) => j === i ? { ...it, ...patch } : it) }));

  const calc = { items: f.items, deliveryFee: f.deliveryFee, discount: f.discountOn ? f.discount : { type: 'amount', value: 0 }, payments: [] };
  const sub = C.subtotal(calc), disc = C.discountAmount(calc), tot = C.total(calc);
  const deposit = f.depositMode === 'none' ? 0 : f.depositMode === 'half' ? Math.round(tot / 2) : f.depositCustom;
  const dueNowAmt = deposit > 0 ? deposit : tot;

  function validate() {
    const e = {};
    if (!f.customerId && !(f.newCustomer && f.newCustomer.name.trim())) e.customer = f.newCustomer ? 'Add the customer’s name.' : 'Choose a customer or add a new one.';
    if (f.newCustomer && f.newCustomer.phone.trim() && C.toWaNumber(f.newCustomer.phone).length !== 13) e.newPhone = 'Enter an 11-digit Nigerian number, like 0803 123 4567.';
    if (!f.items.length) e.items = 'Add at least one item.';
    f.items.forEach((it, i) => {
      if (!it.name.trim()) e['name' + i] = 'Add an item name.';
      if (!(it.unitPrice > 0)) e['price' + i] = 'Price must be more than ₦0.';
    });
    if (f.discountOn) {
      if (f.discount.type === 'percent' && f.discount.value > 100) e.discount = 'A discount can’t be more than 100%.';
      if (f.discount.type === 'amount' && f.discount.value > sub) e.discount = 'A discount can’t be more than the subtotal.';
    }
    if (f.depositMode === 'custom' && !(f.depositCustom > 0)) e.deposit = 'Enter a deposit amount, or choose None.';
    else if (deposit > tot) e.deposit = `The deposit can’t be more than the total (${naira(tot)}).`;
    if (!f.deadline) e.deadline = 'Pick a deadline.';
    return e;
  }
  useEffect(() => { if (tried) setErrors(validate()); }, [f, tried]);
  useEffect(() => {
    if (focusNewRow.current) { focusNewRow.current = false; const el = document.getElementById('iname' + (f.items.length - 1)); el && el.focus(); }
  }, [f.items.length]);

  function submit() {
    setTried(true);
    const e = validate(); setErrors(e);
    const n = Object.keys(e).length;
    if (n) {
      notify(n === 1 ? 'Fix 1 thing before previewing' : `Fix ${n} things before previewing`);
      setTimeout(() => { const el = document.querySelector('main [aria-invalid="true"]'); el && el.focus(); }, 30);
      return;
    }
    let cid = f.customerId;
    if (!cid) cid = A.addCustomer({ name: f.newCustomer.name.trim(), phone: f.newCustomer.phone.trim(), instagramHandle: normHandle(f.newCustomer.handle) });
    const data = {
      customerId: cid,
      items: f.items.map(i => ({ name: i.name.trim(), quantity: i.quantity, unitPrice: i.unitPrice })),
      deliveryFee: f.deliveryFee, discount: calc.discount, depositRequired: deposit, deadline: f.deadline
    };
    let id;
    if (existing) { A.patchOrder(existing.id, data); id = existing.id; }
    else id = A.createOrder(data);
    nav.finishCreate(id);
  }

  const chipDays = [[3, '3 days'], [7, '1 week'], [14, '2 weeks']];
  return (
    <div className="screen">
      <TopBar title={existing ? `Edit ${existing.number}` : 'New payment request'} onBack={nav.back} />
      <form onSubmit={e => { e.preventDefault(); submit(); }} noValidate>
        <section className="form-section" aria-labelledby="h-cust">
          <h2 id="h-cust">Customer</h2>
          <CustomerPicker ctx={{ ...ctx, errors }} f={f} set={set} error={errors.customer} />
        </section>

        <section className="form-section" aria-labelledby="h-items">
          <h2 id="h-items">Items</h2>
          {f.items.map((it, i) => (
            <div className="item-row" key={it.key}>
              <div className="item-head">
                <span className="flabel">Item {i + 1}</span>
                <button type="button" className="icon-btn plain" aria-label={`Remove item ${i + 1}${it.name ? ' (' + it.name + ')' : ''}`} disabled={f.items.length === 1} style={f.items.length === 1 ? { opacity: .35 } : null}
                  onClick={() => setF(p => ({ ...p, items: p.items.filter((_, j) => j !== i) }))}><Icon name="trash" size={20} /></button>
              </div>
              <label htmlFor={'iname' + i} className="sr-only">Item {i + 1} name</label>
              <input id={'iname' + i} className="input" value={it.name} placeholder="e.g. Chunky cardigan" autoComplete="off"
                aria-invalid={errors['name' + i] ? 'true' : undefined} aria-describedby={errors['name' + i] ? 'iname' + i + '-err' : undefined}
                onChange={e => setItem(i, { name: e.target.value })} />
              {errors['name' + i] && <p className="error" id={'iname' + i + '-err'} style={{ marginTop: 6 }}><Icon name="alert" size={16} />{errors['name' + i]}</p>}
              <div className="item-controls">
                <div>
                  <span className="flabel" style={{ display: 'block', fontSize: 13, marginBottom: 6 }} aria-hidden="true">Qty</span>
                  <Stepper value={it.quantity} onChange={q => setItem(i, { quantity: q })} label={`quantity for item ${i + 1}`} />
                </div>
                <div>
                  <label htmlFor={'iprice' + i} className="flabel" style={{ display: 'block', fontSize: 13, marginBottom: 6 }}>Unit price</label>
                  <NumInput id={'iprice' + i} value={it.unitPrice} onChange={v => setItem(i, { unitPrice: v })} error={errors['price' + i]} />
                </div>
              </div>
              {errors['price' + i] && <p className="error" id={'iprice' + i + '-err'} style={{ marginTop: 6 }}><Icon name="alert" size={16} />{errors['price' + i]}</p>}
              {it.quantity > 1 && it.unitPrice > 0 && <p className="line-total">{it.quantity} × {naira(it.unitPrice)} = <b>{naira(it.quantity * it.unitPrice)}</b></p>}
            </div>
          ))}
          {errors.items && <p className="error"><Icon name="alert" size={16} />{errors.items}</p>}
          <button type="button" className="btn btn-small" onClick={() => { focusNewRow.current = true; setF(p => ({ ...p, items: [...p.items, newItem()] })); }}><Icon name="plus" size={18} /> Add another item</button>
        </section>

        <section className="form-section" aria-labelledby="h-extra">
          <h2 id="h-extra">Delivery & discount</h2>
          <Field id="delivery" label="Delivery fee">
            <NumInput id="delivery" value={f.deliveryFee} onChange={v => set({ deliveryFee: v })} />
          </Field>
          <div className="switch-row">
            <span className="flabel" id="disc-lbl">Add a discount</span>
            <span className="switch-wrap"><button type="button" className="switch" role="switch" aria-checked={f.discountOn} aria-labelledby="disc-lbl" onClick={() => set({ discountOn: !f.discountOn })} /></span>
          </div>
          {f.discountOn && (
            <div className="grid2" style={{ marginTop: 10, alignItems: 'start' }}>
              <Seg label="Discount type" value={f.discount.type} onChange={t => set({ discount: { type: t, value: 0 } })} options={[{ value: 'amount', label: '₦' }, { value: 'percent', label: '%' }]} />
              <div>
                <label htmlFor="disc" className="sr-only">Discount {f.discount.type === 'percent' ? 'percentage' : 'amount'}</label>
                <NumInput id="disc" value={f.discount.value} prefix={f.discount.type === 'amount' ? '₦' : null} suffix={f.discount.type === 'percent' ? '%' : null}
                  max={f.discount.type === 'percent' ? 999 : undefined} error={errors.discount} onChange={v => set({ discount: { ...f.discount, value: v } })} />
              </div>
            </div>
          )}
          {errors.discount && <p className="error" id="disc-err" style={{ marginTop: 8 }}><Icon name="alert" size={16} />{errors.discount}</p>}
        </section>

        <section className="form-section" aria-labelledby="h-pay">
          <h2 id="h-pay">Deposit & deadline</h2>
          <div className="field">
            <span className="flabel" id="dep-lbl">Deposit</span>
            <Seg label="Deposit" value={f.depositMode} onChange={m => set({ depositMode: m })}
              options={[{ value: 'none', label: 'None' }, { value: 'half', label: '50%' }, { value: 'custom', label: 'Custom' }]} />
            {f.depositMode === 'half' && <p className="hint">Half of {naira(tot)} = <b>{naira(Math.round(tot / 2))}</b> now, the rest before delivery.</p>}
            {f.depositMode === 'none' && <p className="hint">The customer pays the full amount by the deadline.</p>}
            {f.depositMode === 'custom' && (
              <div style={{ marginTop: 4 }}>
                <label htmlFor="dep" className="sr-only">Custom deposit amount</label>
                <NumInput id="dep" value={f.depositCustom} onChange={v => set({ depositCustom: v })} error={errors.deposit} />
              </div>
            )}
            {errors.deposit && <p className="error" id="dep-err"><Icon name="alert" size={16} />{errors.deposit}</p>}
          </div>
          <Field id="deadline" label="Deadline" error={errors.deadline} hint={f.deadline ? `${C.fmtDate(f.deadline)} · ${C.relDays(f.deadline, today)}` : null}>
            <input id="deadline" type="date" className="input" value={f.deadline} min={existing ? undefined : today}
              aria-invalid={errors.deadline ? 'true' : undefined} aria-describedby={errors.deadline ? 'deadline-err' : 'deadline-hint'}
              onChange={e => set({ deadline: e.target.value })} />
            <div className="chips" role="group" aria-label="Quick deadlines">
              {chipDays.map(([d, l]) => <button type="button" key={d} className="chip" aria-pressed={f.deadline === C.addDays(today, d)} onClick={() => set({ deadline: C.addDays(today, d) })}>{l}</button>)}
            </div>
          </Field>
        </section>

        <section className="form-section breakdown" aria-label="Breakdown">
          <div><span>Subtotal</span><span>{naira(sub)}</span></div>
          {disc > 0 && <div><span>Discount{f.discount.type === 'percent' ? ` (${f.discount.value}%)` : ''}</span><span>−{naira(disc)}</span></div>}
          <div><span>Delivery</span><span>{naira(f.deliveryFee)}</span></div>
          <div className="total"><span>Total</span><span>{naira(tot)}</span></div>
        </section>
      </form>

      <div className="fixed-col summary-bar">
        <div className="sum-nums">

/* =========================================================================
   STAGE 4 — Order detail + Record payment + Reminder preview
   ========================================================================= */
function buildTimeline(o, today) {
  const ev = [], tot = C.total(o);
  ev.push({ key: 'c', icon: 'edit', label: 'Order created', sub: C.fmtDate(o.createdAt), state: 'done' });
  if (o.sharedAt) ev.push({ key: 's', icon: 'send', label: 'Request sent', sub: C.fmtDate(o.sharedAt), state: 'done' });
  else ev.push({ key: 's', icon: 'send', label: 'Request not sent yet', sub: 'Share it on WhatsApp to start tracking', state: 'pending' });
  let run = 0;
  o.payments.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach((p, i) => {
    const before = run; run += p.amount;
    let label = 'Part payment';
    if (i === 0 && o.depositRequired > 0 && before < o.depositRequired && run < tot) label = 'Deposit';
    else if (run >= tot) label = i === 0 ? 'Paid in full' : 'Balance paid';
    ev.push({ key: p.id, icon: 'cash', label: `${label} · ${naira(p.amount)}`, sub: C.fmtDate(p.date) + (p.note ? ` · ${p.note}` : ''), state: 'done' });
  });
  const due = C.dueNow(o), late = C.daysLate(o, today);
  if (o.sharedAt && due.amount > 0) {
    ev.push({ key: 'due', icon: 'clock', label: `${KIND_LABEL[due.kind]} due · ${naira(due.amount)}`, sub: `${C.fmtDate(o.deadline)} · ${late ? C.lateLabel(late) : C.relDays(o.deadline, today)}`, state: late ? 'late' : 'pending' });
    if (due.kind === 'deposit' && C.balance(o) > due.amount) ev.push({ key: 'bal', icon: 'cash', label: `Then balance · ${naira(C.balance(o) - due.amount)}`, sub: 'Before delivery', state: 'pending' });
  }
  if (o.deliveredAt) ev.push({ key: 'd', icon: 'truck', label: 'Delivered', sub: C.fmtDate(o.deliveredAt), state: 'done' });
  return ev;
}

function PaymentSheet({ ctx, order, onClose }) {
  const { today, nav, A, notify } = ctx;
  const c = ctx.custById(order.customerId) || { name: 'Customer' };
  const [snap] = useState(() => ({ due: C.dueNow(order), bal: C.balance(order) }));
  const { due, bal } = snap;
  const [amount, setAmount] = useState(0);
  const [date, setDate] = useState(today);
  const [note, setNote] = useState('');
  const [err, setErr] = useState('');
  const [done, setDone] = useState(null);

  function save() {
    if (!(amount > 0)) return setErr('Enter the amount you received.');
    if (amount > bal) return setErr(`That’s more than the balance of ${naira(bal)}. Refunds and overpayments aren’t supported yet.`);
    if (!date) return setErr('Pick the date you received it.');
    if (date > today) return setErr('The payment date can’t be in the future.');
    A.patchOrder(order.id, o => ({ payments: [...o.payments, { id: C.uid('p'), amount, date, note: note.trim() }] }));
    const left = bal - amount;
    notify(`${naira(amount)} recorded · ${left > 0 ? naira(left) + ' left' : 'fully paid'}`);
    setDone({ left });
  }

  if (done) {
    return (
      <Sheet title="Payment recorded" onClose={onClose}>
        <div className="success">
          <div className="tick"><Icon name="check" size={36} stroke={3} /></div>
          <h2><Amount value={amount} />saved</h2>
          {done.left > 0 ? (
            <>
              <p>{C.firstName(c)} still owes <b style={{ color: 'var(--ink)' }}>{naira(done.left)}</b>. Send the balance request now?</p>
              <div className="stack">
                <button className="btn btn-yellow btn-block btn-lg" onClick={() => { onClose(); nav.go({ name: 'preview', orderId: order.id }); }}><Icon name="send" /> Send balance request now</button>
                <button className="btn btn-block" onClick={onClose}>Not now</button>
              </div>
            </>
          ) : (
            <>
              <p>{order.number} is fully paid. Send {C.firstName(c)} a receipt?</p>
              <div className="stack">
                <button className="btn btn-yellow btn-block btn-lg" onClick={() => { onClose(); nav.go({ name: 'receipt', orderId: order.id }); }}><Icon name="receipt" /> Share receipt</button>
                <button className="btn btn-block" onClick={onClose}>Done</button>
              </div>
            </>
          )}
        </div>
      </Sheet>
    );
  }

  return (
    <Sheet title="Record payment" onClose={onClose}>
      <p className="hint" style={{ marginBottom: 12 }}>{c.name} · {order.number} · {naira(bal)} left</p>
      <div className="field">
        <label htmlFor="pay-amt">Amount received</label>
        <NumInput id="pay-amt" value={amount} onChange={v => { setAmount(v); setErr(''); }} error={err} />
        <div className="chips" role="group" aria-label="Amount shortcuts">
          {due.kind === 'deposit' && due.amount < bal && <button type="button" className="chip" aria-pressed={amount === due.amount} onClick={() => { setAmount(due.amount); setErr(''); }}>Deposit {naira(due.amount)}</button>}
          <button type="button" className="chip" aria-pressed={amount === bal} onClick={() => { setAmount(bal); setErr(''); }}>Full balance {naira(bal)}</button>
        </div>
        {err && <p className="error" id="pay-amt-err"><Icon name="alert" size={16} />{err}</p>}
      </div>
      <div className="grid2">
        <Field id="pay-date" label="Date received">
          <input id="pay-date" type="date" className="input" value={date} max={today} onChange={e => { setDate(e.target.value); setErr(''); }} />
        </Field>
        <Field id="pay-note" label="Note (optional)">
          <input id="pay-note" className="input" value={note} placeholder="e.g. Opay transfer" onChange={e => setNote(e.target.value)} />
        </Field>
      </div>
      <div className="callout"><Icon name="bank" size={20} /><span>Only record this after checking your bank app.</span></div>
      <button className="btn btn-yellow btn-block btn-lg" onClick={save}><Icon name="check" /> Save payment</button>
    </Sheet>
  );
}

const TONES = [{ id: 'friendly', label: 'Friendly' }, { id: 'neutral', label: 'Neutral' }, { id: 'firm', label: 'Firm' }];
function ReminderScreen({ ctx, orderId }) {
  const { state, today, nav, notify } = ctx;
  const o = ctx.orderById(orderId), c = ctx.custById(o.customerId), s = state.seller;
  const [tone, setTone] = useState(s.defaultReminderTone || 'friendly');
  const [text, setText] = useState(() => C.reminderMessage(tone, o, c, s, today));
  const [edited, setEdited] = useState(false);
  const tabRefs = useRef([]);
  if (!C.isOpen(o)) {
    return (
      <div className="screen">
        <TopBar title="Reminder" onBack={nav.back} />
        <Empty title="Nothing to remind about">{o.sharedAt ? `${o.number} is fully paid.` : 'Send the payment request first, then you can remind them.'}</Empty>
      </div>
    );
  }
  const pick = t => { setTone(t); setText(C.reminderMessage(t, o, c, s, today)); setEdited(false); };
  const onTabKey = (e, i) => {
    let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % TONES.length;
    if (e.key === 'ArrowLeft') n = (i + TONES.length - 1) % TONES.length;
    if (n !== null) { e.preventDefault(); pick(TONES[n].id); tabRefs.current[n].focus(); }
  };
  const due = C.dueNow(o), late = C.daysLate(o, today);
  return (
    <div className="screen">
      <TopBar title="Reminder" onBack={nav.back} />
      <div className="card" style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 16 }}>
        <Avatar name={c.name} id={c.id} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <b>{c.name}</b>
          <div className="hint">{naira(due.amount)} {KIND_LABEL[due.kind].toLowerCase()} · {o.number}</div>
        </div>
        {late > 0 && <LatePill days={late} />}
      </div>
      <div className="tabs" role="tablist" aria-label="Message tone">
        {TONES.map((t, i) => (
          <button key={t.id} ref={el => tabRefs.current[i] = el} role="tab" id={'tab-' + t.id} aria-selected={tone === t.id} aria-controls="tone-panel"
            tabIndex={tone === t.id ? 0 : -1} onKeyDown={e => onTabKey(e, i)} onClick={() => pick(t.id)}>{t.label}</button>
        ))}
      </div>
      <div role="tabpanel" id="tone-panel" aria-labelledby={'tab-' + tone}>
        <div className="field">
          <label htmlFor="rem-text">Message (you can edit it)</label>
          <textarea id="rem-text" className="textarea" value={text} onChange={e => { setText(e.target.value); setEdited(true); }} aria-describedby="rem-hint" />
          <p className="hint" id="rem-hint">{edited ? 'Switching tone will replace your edits.' : 'Bank details are included as plain text so they can copy them.'}</p>
        </div>
      </div>
      <button className="btn btn-yellow btn-lg btn-block" onClick={() => { openWhatsApp(c.phone, text); notify('Opening WhatsApp · press send when ready'); }} disabled={!text.trim()}>
        <Icon name="chat" /> Open WhatsApp
      </button>
      <div className="callout" style={{ marginTop: 16 }}><Icon name="info" size={20} /><span>Nothing is sent automatically. WhatsApp opens with this message and you press send.</span></div>
    </div>
  );
}

      <TopBar title={`Receipt ${o.number}`} onBack={nav.back} />
      <div className="doc-tray"><MoneyDoc kind="receipt" order={o} customer={c} seller={s} today={today} docRef={ref} /></div>
      <DocActions onShare={() => { openWhatsApp(c.phone, msg); notify('Opening WhatsApp'); }} shareLabel="Share receipt on WhatsApp" docRef={ref} filename={`${o.number}-receipt.png`} notify={notify}
        extra={<button className="btn" onClick={async () => notify(await copyText(msg) ? 'Receipt text copied' : 'Couldn’t copy')}><Icon name="copy" size={20} /> Copy text</button>} />
      <details className="msg-preview"><summary>See the WhatsApp message</summary><pre>{msg}</pre></details>
    </div>
  );
}

const FILTERS = [
  { id: 'all', label: 'All' }, { id: 'overdue', label: 'Overdue' }, { id: 'deposit', label: 'Awaiting deposit' },
  { id: 'balance', label: 'Balance due' }, { id: 'paid', label: 'Paid' }, { id: 'draft', label: 'Drafts' }
];
const FILTER_EMPTY = {
  all: ['No orders yet', 'Create a payment request and it will show up here.'],
  overdue: ['Nothing overdue', 'No one has missed a deadline. Nice.'],
  deposit: ['No deposits waiting', 'Orders waiting for their first payment show here.'],
  balance: ['No balances due', 'Orders with a deposit paid and money still owed show here.'],
  paid: ['No paid orders yet', 'Fully paid orders show here, ready for a receipt.'],
  draft: ['No drafts', 'Requests you haven’t shared yet show here.']
};
function OrdersScreen({ ctx, filter: initial }) {
  const { state, today, nav } = ctx;
  const [filter, setFilter] = useState(initial || 'all');
  const match = (o, f) => f === 'all' ? true : f === 'overdue' ? C.daysLate(o, today) > 0 : C.status(o) === f;
  const list = C.sortOrders(state.orders.filter(o => match(o, filter)), today);
  return (
    <div className="screen">
      <TopBar title="Orders" right={<button className="icon-btn" aria-label="New payment request" onClick={() => nav.go({ name: 'create' })}><Icon name="plus" /></button>} />
      <div className="chips scroll" role="group" aria-label="Filter orders">
        {FILTERS.map(f => (
          <button key={f.id} className="chip" aria-pressed={filter === f.id} onClick={() => setFilter(f.id)}>
            {f.label} <span className="count">{state.orders.filter(o => match(o, f.id)).length}</span>
          </button>
        ))}
      </div>
      <p className="sr-only" aria-live="polite">{list.length} orders shown</p>
      {list.length
        ? <div className="list">{list.map(o => <OrderRow key={o.id} o={o} ctx={ctx} />)}</div>
        : <Empty title={FILTER_EMPTY[filter][0]} action={filter === 'all' && <button className="btn btn-yellow" onClick={() => nav.go({ name: 'create' })}><Icon name="plus" /> New payment request</button>}>{FILTER_EMPTY[filter][1]}</Empty>}
    </div>
  );
}

function CustomersScreen({ ctx }) {
  const { state, nav } = ctx;
  const [q, setQ] = useState('');
  const ql = q.trim().toLowerCase();
  const rows = state.customers
    .filter(c => !ql || c.name.toLowerCase().includes(ql) || (c.instagramHandle || '').toLowerCase().includes(ql))
    .map(c => ({ c, st: C.customerStats(state, c.id) }))
    .sort((a, b) => (b.st.owed - a.st.owed) || a.c.name.localeCompare(b.c.name));
  return (
    <div className="screen">
      <TopBar title="Customers" />
      <div className="search">
        <label htmlFor="cs" className="sr-only">Search customers</label>
        <Icon name="search" size={20} />
        <input id="cs" className="input" type="search" placeholder="Search name or @handle" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      {!state.customers.length
        ? <Empty title="No customers yet" action={<button className="btn btn-yellow" onClick={() => nav.go({ name: 'create' })}><Icon name="plus" /> New payment request</button>}>Customers are saved when you create a payment request for them.</Empty>
        : rows.length
          ? <div className="list">{rows.map(({ c, st }) => (
              <button key={c.id} className="row" onClick={() => nav.go({ name: 'customer', customerId: c.id })}>
                <Avatar name={c.name} id={c.id} size={40} />
                <span className="row-main"><span className="row-title">{c.name}</span><span className="row-sub">{c.instagramHandle || c.phone || 'No contact saved'}</span></span>
                <span className="row-end">{st.owed > 0 ? <><span className="row-amt">{naira(st.owed)}</span><span className="row-kind">owed</span></> : <span className="row-kind">All paid</span>}</span>
                <Icon name="chevron" size={18} className="row-chev" />
              </button>
            ))}</div>
          : <Empty title="No matches">No customer matches “{q}”. Check the spelling or search by @handle.</Empty>}
    </div>
  );
}

function CustomerScreen({ ctx, customerId }) {
  const { state, today, nav } = ctx;
  const c = ctx.custById(customerId);
  const st = C.customerStats(state, c.id);
  const orders = C.sortOrders(st.orders, today);
  return (
    <div className="screen">
      <TopBar title="Customer" onBack={nav.back} />
      <div className="profile-head">
        <Avatar name={c.name} id={c.id} size={84} />
        <h2>{c.name}</h2>
        <p>Customer since {C.fmtLong(c.createdAt)}</p>
      </div>
      <div className="stats">
        <div className="stat"><p className="l">Total spent</p><p className="v"><Amount value={st.spent} /></p></div>
        <div className={'stat' + (st.owed > 0 ? ' owed' : '')}><p className="l">Currently owed</p><p className="v"><Amount value={st.owed} /></p></div>
      </div>
      <div className="card contact" style={{ padding: '4px 16px' }}>
        {c.phone ? (
          <a href={C.waLink(c.phone, `Hi ${C.firstName(c)}! `)} target="_blank" rel="noopener noreferrer">
            <span className="ic"><Icon name="chat" size={18} /></span>
            <span style={{ flex: 1 }}>{c.phone}<small>Chat on WhatsApp</small></span>
            <Icon name="chevron" size={18} className="row-chev" />
          </a>
        ) : <div style={{ minHeight: 52, display: 'flex', alignItems: 'center', color: 'var(--muted)' }}>No phone number saved</div>}
        {c.instagramHandle && (
          <a href={`https://instagram.com/${c.instagramHandle.replace(/^@/, '')}`} target="_blank" rel="noopener noreferrer">
            <span className="ic" style={{ background: 'var(--pink)' }}><Icon name="at" size={18} /></span>
            <span style={{ flex: 1 }}>{c.instagramHandle}<small>Open Instagram profile</small></span>
            <Icon name="chevron" size={18} className="row-chev" />
          </a>
        )}
      </div>
      <button className="btn btn-yellow btn-block" style={{ marginTop: 16 }} onClick={() => nav.go({ name: 'create', customerId: c.id })}><Icon name="plus" /> New request for {C.firstName(c)}</button>
      <section className="section" aria-labelledby="h-hist">
        <div className="section-head"><h2 id="h-hist">Order history</h2><span className="badge">{orders.length}</span></div>
        {orders.length
          ? <div className="list">{orders.map(o => <OrderRow key={o.id} o={o} ctx={ctx} />)}</div>
          : <Empty title="No orders yet">Create a payment request for {C.firstName(c)} to start their history.</Empty>}
      </section>
    </div>
  );
}

const BANKS = ['Access Bank', 'GTBank', 'First Bank', 'UBA', 'Zenith Bank', 'Kuda', 'Opay', 'Moniepoint', 'PalmPay', 'Fidelity Bank', 'Wema Bank', 'Stanbic IBTC', 'Sterling Bank', 'FCMB', 'Union Bank', 'Ecobank'];
function validateSeller(f, step) {
  const e = {};
  if (!step || step === 1) { if (!f.businessName.trim()) e.businessName = 'Add your business name.'; }
  if (!step || step === 2) {
    if (!f.bankName.trim()) e.bankName = 'Add your bank.';
    if (!/^\d{10}$/.test(f.accountNumber.replace(/\s/g, ''))) e.accountNumber = 'Nigerian account numbers have 10 digits.';
    if (!f.accountName.trim()) e.accountName = 'Add the name on the account.';
  }
  return e;
}
function SellerFields({ f, set, err, only }) {
  const inp = (id, label, props = {}, hint) => (
    <Field id={'s-' + id} label={label} error={err[id]} hint={hint}>
      <input id={'s-' + id} className="input" value={f[id]} aria-invalid={err[id] ? 'true' : undefined}
        aria-describedby={err[id] ? 's-' + id + '-err' : hint ? 's-' + id + '-hint' : undefined}
        onChange={e => set({ [id]: e.target.value })} {...props} />
    </Field>
  );
  return (
    <>
      {(!only || only === 1) && <>
        {inp('businessName', 'Business name', { placeholder: 'e.g. Mimi Crochets', autoComplete: 'organization' }, 'Shown on every request and receipt.')}
        {only !== 1 && inp('logoInitials', 'Logo initials', { maxLength: 3, placeholder: 'MC' })}
        {inp('phone', 'Your WhatsApp number', { type: 'tel', inputMode: 'tel', placeholder: '0803 000 1122' }, 'Optional. Printed on your documents.')}
      </>}
      {(!only || only === 2) && <>
        {inp('bankName', 'Bank', { list: 'banks', placeholder: 'e.g. GTBank', autoComplete: 'off' })}
        <datalist id="banks">{BANKS.map(b => <option key={b} value={b} />)}</datalist>
        {inp('accountNumber', 'Account number', { inputMode: 'numeric', maxLength: 10, placeholder: '0123456789' })}
        {inp('accountName', 'Account name', { placeholder: 'As it appears in your bank app' })}
      </>}
    </>
  );
}

function SetupScreen({ ctx }) {
  const { A, nav, notify, setSheet } = ctx;
  const [step, setStep] = useState(1);
  const [f, setF] = useState({ businessName: '', logoInitials: '', phone: '', bankName: '', accountNumber: '', accountName: '' });
  const [err, setErr] = useState({});
  const set = p => setF(x => ({ ...x, ...p }));
  useEffect(() => { const h = document.querySelector('main h1'); h && h.focus({ preventScroll: true }); }, [step]);
  function next() {
    const e = validateSeller(f, step); setErr(e);
    if (Object.keys(e).length) { setTimeout(() => { const el = document.querySelector('main [aria-invalid="true"]'); el && el.focus(); }, 30); return; }
    if (step === 1) { if (!f.accountName) set({ accountName: f.businessName.trim() }); setStep(2); return; }
    A.setSeller({ ...f, businessName: f.businessName.trim(), accountNumber: f.accountNumber.replace(/\s/g, ''), logoInitials: initialsOf(f.businessName), defaultReminderTone: 'friendly' });
    nav.reset({ name: 'home' });
    notify('You’re all set!');
  }
  return (
    <div className="screen">
      <div className="setup-top on-dark">
        <svg className="hero-shape" style={{ right: -20, top: -24 }} width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="46" fill="#9A0F5D" /></svg>
        <svg className="hero-shape" style={{ right: 70, bottom: 14 }} width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="3" width="28" height="28" rx="8" fill="#D3F6C0" stroke="#23221F" strokeWidth="1.5" transform="rotate(14 17 17)" /></svg>
        <div className="steps" aria-hidden="true"><span className="on" /><span className={step === 2 ? 'on' : ''} /></div>
        <p style={{ fontWeight: 700, color: '#fff', marginTop: 0 }}>Step {step} of 2</p>
        <h1 tabIndex={-1}>{step === 1 ? 'Let’s set up your shop' : 'Where should customers pay?'}</h1>
        <p>{step === 1 ? 'This takes about a minute. Customers see these details on every request.' : 'These details go on every payment request, so customers can copy them straight into their bank app.'}</p>
      </div>
      <form className="form-section" onSubmit={e => { e.preventDefault(); next(); }} noValidate>
        <SellerFields f={f} set={set} err={err} only={step} />
        <div className="stack" style={{ marginTop: 6 }}>
          <button type="submit" className="btn btn-yellow btn-lg btn-block">{step === 1 ? 'Next: bank details' : 'Finish setup'} <Icon name="chevron" /></button>
          {step === 2 && <button type="button" className="btn btn-block" onClick={() => setStep(1)}><Icon name="back" /> Back</button>}
        </div>
      </form>
      <p style={{ textAlign: 'center' }}>
        <button className="link-btn" onClick={() => setSheet({ type: 'confirm', title: 'Load demo data?', body: 'Explore with a sample crochet shop, Mimi Crochets, with 12 orders and 9 customers.', confirmLabel: 'Load demo data', onConfirm: A.resetDemo })}>Just exploring? Load demo data</button>
      </p>
    </div>
  );
}

function SettingsScreen({ ctx }) {
  const { state, A, notify, setSheet } = ctx;
  const s = state.seller;
  const [f, setF] = useState({ businessName: s.businessName, logoInitials: s.logoInitials || '', phone: s.phone || '', bankName: s.bankName, accountNumber: s.accountNumber, accountName: s.accountName });
  const [err, setErr] = useState({});
  const set = p => setF(x => ({ ...x, ...p }));
  const dirty = Object.keys(f).some(k => (f[k] || '') !== (s[k] || ''));
  function save() {
    const e = validateSeller(f); setErr(e);
    if (Object.keys(e).length) { notify('Check the highlighted fields'); setTimeout(() => { const el = document.querySelector('main [aria-invalid="true"]'); el && el.focus(); }, 30); return; }
    A.setSeller({ ...s, ...f, businessName: f.businessName.trim(), logoInitials: (f.logoInitials.trim() || initialsOf(f.businessName)).toUpperCase(), accountNumber: f.accountNumber.replace(/\s/g, '') });
    notify('Settings saved');
  }
  return (
    <div className="screen">
      <TopBar title="Settings" />
      {!C.Store.persistent && <div className="callout warn"><Icon name="alert" size={20} /><span>Your browser is blocking storage, so changes only last until you close this tab.</span></div>}
      <form onSubmit={e => { e.preventDefault(); save(); }} noValidate>
        <section className="form-section" aria-labelledby="h-shop"><h2 id="h-shop">Your shop</h2><SellerFields f={f} set={set} err={err} only={1} /><Field id="s-logoInitials" label="Logo initials"><input id="s-logoInitials" className="input" maxLength={3} value={f.logoInitials} onChange={e => set({ logoInitials: e.target.value })} /></Field></section>
        <section className="form-section" aria-labelledby="h-bank"><h2 id="h-bank">Bank details</h2><SellerFields f={f} set={set} err={err} only={2} /></section>
        <button type="submit" className="btn btn-yellow btn-block btn-lg" disabled={!dirty}><Icon name="check" /> {dirty ? 'Save changes' : 'All changes saved'}</button>
      </form>
      <section className="form-section" style={{ marginTop: 20 }} aria-labelledby="h-tone">
        <h2 id="h-tone">Default reminder tone</h2>
        <Seg label="Default reminder tone" value={s.defaultReminderTone} onChange={t => { A.setSeller({ ...s, defaultReminderTone: t }); notify(`Reminders will start ${t}`); }} options={TONES.map(t => ({ value: t.id, label: t.label }))} />
        <p className="hint" style={{ marginTop: 8 }}>You can still switch tone on each reminder.</p>
      </section>
      <section className="form-section" aria-labelledby="h-demo">
        <h2 id="h-demo">Demo</h2>
        <div className="stack">
          <button className="btn btn-block" onClick={() => setSheet({ type: 'confirm', danger: true, title: 'Reset demo data?', body: 'This replaces everything with the Mimi Crochets sample shop. Any orders you added will be lost.', confirmLabel: 'Reset demo data', onConfirm: () => { A.resetDemo(); notify('Demo data restored'); } })}><Icon name="refresh" /> Reset demo data</button>
          <button className="btn btn-block" onClick={() => setSheet({ type: 'confirm', danger: true, title: 'Start fresh?', body: 'This clears all shop details, customers and orders, and shows the first-run setup.', confirmLabel: 'Clear everything', onConfirm: A.startFresh })}><Icon name="trash" /> Start fresh (first-run setup)</button>
        </div>
      </section>
      <p className="settings-foot">Everything is stored on this device only. Nothing is sent anywhere unless you share it.</p>
    </div>
  );
}

function NotFound({ nav }) {
  return <div className="screen"><TopBar title="Not found" onBack={nav.back} /><Empty title="This order no longer exists">It may have been deleted.</Empty></div>;
}

/* =========================================================================
   App root
   ========================================================================= */
function loadState() {
  const s = C.Store.get(KEY);
  if (s && s.version === 1 && Array.isArray(s.orders)) return s;
  const fresh = C.buildSample(C.todayISO()); // first load: preload demo shop
  C.Store.set(KEY, fresh);
  return fresh;
}

function App() {
  const today = C.todayISO();
  const [state, setState] = useState(loadState);
  useEffect(() => { C.Store.set(KEY, state); }, [state]);
  const [stack, setStack] = useState(() => [{ name: state.seller ? 'home' : 'setup' }]);
  const route = stack[stack.length - 1];
  const [toast, setToast] = useState(null);
  const [sheet, setSheet] = useState(null);
  const timer = useRef(null);
  const notify = msg => { clearTimeout(timer.current); setToast({ msg, key: Date.now() }); timer.current = setTimeout(() => setToast(null), 3000); };

  const nav = useMemo(() => ({
    go: r => setStack(s => [...s, r]),
    back: () => setStack(s => s.length > 1 ? s.slice(0, -1) : [{ name: 'home' }]),
    tab: n => setStack([{ name: n }]),
    reset: r => setStack([r]),
    replace: r => setStack(s => [...s.slice(0, -1), r]),
    // After saving the create form: return to an existing preview of this order, or replace the form with one
    finishCreate: id => setStack(s => {
      const prev = s[s.length - 2];
      if (prev && prev.name === 'preview' && prev.orderId === id) return s.slice(0, -1);
      return [...s.slice(0, -1), { name: 'preview', orderId: id }];
    })
  }), []);

  const A = {
    createOrder(data) {
      const id = C.uid('o');
      setState(s => ({ ...s, nextNumber: s.nextNumber + 1, orders: [...s.orders, { ...data, id, number: C.invNumber(s.nextNumber), payments: [], createdAt: today, sharedAt: null, deliveredAt: null }] }));
      return id;
    },
    addCustomer(c) { const id = C.uid('c'); setState(s => ({ ...s, customers: [...s.customers, { ...c, id, createdAt: today }] })); return id; },
    patchOrder(id, patch) { setState(s => ({ ...s, orders: s.orders.map(o => o.id === id ? { ...o, ...(typeof patch === 'function' ? patch(o) : patch) } : o) })); },
    deleteOrder(id) { setState(s => ({ ...s, orders: s.orders.filter(o => o.id !== id) })); }, // nextNumber is untouched, so numbers are never reused
    setSeller(seller) { setState(s => ({ ...s, seller })); },
    resetDemo() { setState(C.buildSample(today)); nav.reset({ name: 'home' }); },
    startFresh() { setState(C.emptyState()); nav.reset({ name: 'setup' }); }
  };

  const orderById = id => state.orders.find(o => o.id === id);
  const custById = id => state.customers.find(c => c.id === id);
  const ctx = { state, today, nav, A, notify, setSheet, orderById, custById };

  const routeKey = stack.length + ':' + route.name + ':' + (route.orderId || route.customerId || route.filter || '');
  useEffect(() => {
    window.scrollTo(0, 0);
    const h = document.querySelector('main h1');
    if (h && stack.length + (route.name === 'home' ? 0 : 1) > 1) h.focus({ preventScroll: true });
  }, [routeKey]);

  const needsOrder = ['preview', 'order', 'reminder', 'receipt'].includes(route.name) || (route.name === 'create' && route.orderId);
  let screen;
  if (!state.seller) screen = <SetupScreen ctx={ctx} />;
  else if (needsOrder && (!orderById(route.orderId) || !custById(orderById(route.orderId).customerId))) screen = <NotFound nav={nav} />;
  else if (route.name === 'customer' && !custById(route.customerId)) screen = <NotFound nav={nav} />;
  else switch (route.name) {
    case 'home': screen = <Dashboard ctx={ctx} />; break;
    case 'orders': screen = <OrdersScreen key={routeKey} ctx={ctx} filter={route.filter} />; break;
    case 'customers': screen = <CustomersScreen ctx={ctx} />; break;
    case 'settings': screen = <SettingsScreen ctx={ctx} />; break;
    case 'create': screen = <CreateScreen key={routeKey} ctx={ctx} orderId={route.orderId} customerId={route.customerId} />; break;
    case 'preview': screen = <PreviewScreen ctx={ctx} orderId={route.orderId} />; break;
    case 'order': screen = <OrderScreen ctx={ctx} orderId={route.orderId} />; break;
    case 'reminder': screen = <ReminderScreen key={routeKey} ctx={ctx} orderId={route.orderId} />; break;
    case 'receipt': screen = <ReceiptScreen ctx={ctx} orderId={route.orderId} />; break;
    case 'customer': screen = <CustomerScreen ctx={ctx} customerId={route.customerId} />; break;
    default: screen = <Dashboard ctx={ctx} />;
  }
  const showNav = !!state.seller && TABS.some(t => t.id === route.name);
  const hasBar = !!state.seller && route.name === 'create';
  const sheetOrder = sheet && sheet.type === 'payment' && orderById(sheet.orderId);

  return (
    <div className="app">
      <a className="skip" href="#main">Skip to content</a>
      <main id="main" key={routeKey} className={showNav ? 'with-nav' : hasBar ? 'with-bar' : ''}>{screen}</main>
      {showNav && <BottomNav active={route.name} nav={nav} />}
      {sheetOrder && <PaymentSheet ctx={ctx} order={sheetOrder} onClose={() => setSheet(null)} />}
      {sheet && sheet.type === 'confirm' && <ConfirmSheet s={sheet} onClose={() => setSheet(null)} />}
      <div className={'fixed-col toast-wrap' + (showNav ? ' above-nav' : hasBar ? ' above-bar' : '')} role="status" aria-live="polite">
        {toast && <div className="toast" key={toast.key}><Icon name="check" size={18} />{toast.msg}</div>}
      </div>
      <aside className="desk-note" aria-hidden="true">
        <span className="tag">Prototype</span>
        <h2>Orders, not invoices.</h2>
        <p>One order, one customer, several payments over time. The app makes the payment request and the receipt from it.</p>
        <p>Data lives in this browser only. Reset it any time from Settings.</p>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
